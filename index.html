<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="input-container">
      <input type="text" name="date" id="dateIn" placeholder="תאריך" />
      <input type="text" name="cash" id="cashIn" placeholder="מזומן" />

      <label for="barDrop">להוריד לבר 5%?</label>
      <input type="button" value="אישור" id="confBtn" />
    </div>
    <script src="start.js"></script>
  </body>
